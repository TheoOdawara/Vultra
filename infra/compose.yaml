name: vultra

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_MIGRATION_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?}
      POSTGRES_SERVICE_USER: ${POSTGRES_SERVICE_USER:?}
      POSTGRES_SERVICE_PASSWORD: ${POSTGRES_SERVICE_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/create-service-role.sh:/docker-entrypoint-initdb.d/create-service-role.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "--host", "127.0.0.1", "--username", "${POSTGRES_MIGRATION_USER:?}", "--dbname", "${POSTGRES_DB:?}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4.11-bookworm
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ../apps/api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_SERVICE_USER:?}:${POSTGRES_SERVICE_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      REDIS_URL: redis://redis:6379/0
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:?}
    ports:
      - "127.0.0.1:${API_PORT:?}:8000"

  migrate:
    build: ../apps/api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_SERVICE_USER:?}:${POSTGRES_SERVICE_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_MIGRATION_USER:?}:${POSTGRES_MIGRATION_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
    command: ["alembic", "upgrade", "head"]

volumes:
  postgres_data:
