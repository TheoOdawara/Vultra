# =============================================================================
# VULTRA — Docker Compose (Desenvolvimento Local)
# =============================================================================
# Pré-requisitos:
#   cp infra/.env.example infra/.env  # preencha os secrets antes de subir
#
# Uso:
#   docker compose -f infra/docker-compose.yml up -d          # subir tudo
#   docker compose -f infra/docker-compose.yml up api-core    # serviço isolado
#   docker compose -f infra/docker-compose.yml logs -f        # seguir logs
#   docker compose -f infra/docker-compose.yml down -v        # destruir + volumes
#   sh infra/scripts/check-pgvector.sh                        # smoke test da versão do pgvector
#
# Stack: PostgreSQL 16 + pgvector | Redis 7 | AI Service (FastAPI) | API Core (Bun)

name: vultra-dev

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 16 + pgvector 0.8 (pinado — ver ADR-002 em docs/database/adrs/)
  # Tag exata obrigatória: reprodutibilidade dos experimentos da IC depende da
  # versão do índice HNSW/iterative_scan. Validar com infra/scripts/check-pgvector.sh
  # Referência: docs/database/README.md
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    container_name: vultra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-vultra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB:       ${POSTGRES_DB:-vultra_db}
      PGDATA:            /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vultra} -d ${POSTGRES_DB:-vultra_db}"]
      interval: 10s
      timeout:  5s
      retries:  5
      start_period: 10s
    networks:
      - vultra-net

  # ---------------------------------------------------------------------------
  # Redis 7 — Fila de mensagens entre api-core e ai-service
  # Referência: docs/backend/arquitetura/fila-redis.md
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: vultra-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory   256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5
      start_period: 5s
    networks:
      - vultra-net

  # ---------------------------------------------------------------------------
  # AI Service — FastAPI + InsightFace (RetinaFace + ArcFace 512d)
  # Referência: apps/ai-service/
  # ---------------------------------------------------------------------------
  ai-service:
    build:
      context: ../apps/ai-service
      dockerfile: Dockerfile
    container_name: vultra-ai-service
    restart: unless-stopped
    environment:
      REDIS_URL:         "redis://:${REDIS_PASSWORD}@redis:6379"
      AI_QUEUE_NAME:     "ai:recognition:queue"
      AI_RESULT_PREFIX:  "ai:recognition:result:"
      MODEL_NAME:        buffalo_l
      MAX_PAYLOAD_BYTES: 1048576
      JOB_TIMEOUT_S:     3.0
      RESULT_TTL_S:      60
      DEBUG:             "false"
      HOST:              0.0.0.0
      PORT:              8000
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout:  5s
      retries:  3
      start_period: 60s   # InsightFace model load takes ~30-60s on first run
    networks:
      - vultra-net

  # ---------------------------------------------------------------------------
  # API Core — Bun + ElysiaJS + Better Auth + Drizzle ORM
  # Referência: apps/api-core/
  #
  # ⚠️  Migrations: execute manualmente antes do primeiro boot:
  #   docker compose -f infra/docker-compose.yml exec api-core \
  #     bun run db:migrate
  # ---------------------------------------------------------------------------
  api-core:
    build:
      context: ../apps/api-core
      dockerfile: Dockerfile
    container_name: vultra-api-core
    restart: unless-stopped
    environment:
      PORT:                        "3000"
      # Postgres — usa o hostname do container (não localhost)
      DATABASE_URL:                "postgresql://${POSTGRES_USER:-vultra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vultra_db}"
      # Redis — usa o hostname do container
      REDIS_URL:                   "redis://:${REDIS_PASSWORD}@redis:6379"
      # Better Auth
      BETTER_AUTH_SECRET:          "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}"
      BETTER_AUTH_URL:             "${BETTER_AUTH_URL:-http://localhost:3000}"
      BETTER_AUTH_TRUSTED_ORIGINS: "${BETTER_AUTH_TRUSTED_ORIGINS:-http://localhost:3001,http://localhost:3002,http://localhost:3003}"
    ports:
      - "${API_CORE_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/v1/health/ai-service"]
      interval: 15s
      timeout:  5s
      retries:  3
      start_period: 15s
    networks:
      - vultra-net

# =============================================================================
# Volumes nomeados — persistência local entre restarts
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# =============================================================================
# Rede interna — isolamento entre serviços
# =============================================================================
networks:
  vultra-net:
    driver: bridge
