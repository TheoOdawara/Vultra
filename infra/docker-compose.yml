name: vultra

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: vultra_migrations
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: vultra
      SERVICE_DATABASE_PASSWORD: ${SERVICE_DATABASE_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/create-service-role.sh:/docker-entrypoint-initdb.d/create-service-role.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "--host", "127.0.0.1", "--username", "vultra_migrations", "--dbname", "vultra"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4.11-bookworm
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ../apps/api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://vultra_service:${SERVICE_DATABASE_PASSWORD:?}@postgres:5432/vultra
      REDIS_URL: redis://redis:6379/0
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:?}
    ports:
      - "127.0.0.1:8000:8000"

  migrate:
    build: ../apps/api
    profiles: [migrate]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://vultra_migrations:${POSTGRES_PASSWORD:?}@postgres:5432/vultra
    command: ["alembic", "upgrade", "head"]

volumes:
  postgres_data:
