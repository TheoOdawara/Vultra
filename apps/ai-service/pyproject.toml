[project]
name = "vultra-ai-service"
version = "1.0.0"
description = "VULTRA AI Microservice — InsightFace embedding + Redis worker"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "insightface>=0.7.3",
    "onnxruntime>=1.17.0",       # CPU inference backend for InsightFace
    "redis>=5.2.0",
    "opencv-python-headless>=4.10.0",
    "numpy>=1.26.0",
    "pillow>=11.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",             # TestClient transport
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
