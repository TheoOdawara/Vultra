[project]
name = "vultra-api"
version = "0.1.0"
description = "Vultra backend service"
requires-python = "==3.13.*"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.142.2",
    "fastapi-cli==0.0.32",
    "fastapi-users==15.0.5",
    "fastapi-users-db-sqlalchemy==7.0.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.54",
    "structlog==26.1.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.uv]
package = false

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "S", "PT", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
files = ["app", "migrations", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error"]
