[project]
name = "vultra-pipeline"
version = "0.1.0"
description = "Vultra inference pipeline"
requires-python = "==3.13.*"
dependencies = [
    "insightface==2.1",
    "numpy==2.5.3",
    "onnxruntime==1.30.0",
    "opencv-python-headless==5.0.0.93",
    "scikit-image==0.26.0",
]

[project.scripts]
download-models = "pipeline.download_models:main"

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[build-system]
requires = ["uv_build==0.12.23"]
build-backend = "uv_build"

[tool.uv]
override-dependencies = ["opencv-python ; sys_platform == 'never'"]

[tool.uv.build-backend]
module-name = "pipeline"
module-root = ""

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "S", "PT", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"pipeline/download_models.py" = ["S310"]

[tool.mypy]
strict = true
files = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
